name: Kura SBOM upload

on:
  schedule:
    # At 06:13 on Saturday
    - cron: "13 6 * * 6"
  workflow_dispatch:
    inputs:
      target_branch:
        type: string
        default: 'develop'
        required: true
  workflow_run:
    workflows: ["Release Notes automation"]
    types:
      - completed

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  call-workflow-in-public-repo:
    uses: eclipse-kura/.github/.github/workflows/_shared-sbom-cyclonedx.yml@main
